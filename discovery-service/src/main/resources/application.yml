server:
  port: 8761

spring:
  application:
    name: discovery-service

eureka:
  client:
    # The registry does not register with itself.
    register-with-eureka: false
    fetch-registry: false
  server:
    # Off for a demo: with a handful of instances, self-preservation keeps dead
    # ones listed and makes the scaling demo confusing.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
