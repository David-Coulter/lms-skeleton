services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      retries: 10
    ports:
      - "5432:5432"
    networks: [lh-internal]

  user-service:
    build: ./user-service
    environment:
      SPRING_PROFILES_ACTIVE: ${PROFILE}
      DB_URL: jdbc:postgresql://postgres:5432/userdb
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 8101
      EUREKA_ENABLED: "false"     # flip to true once discovery-service exists
      EUREKA_URL: http://discovery-service:8761/eureka
    ports:
      - "8101:8101"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [lh-internal]
    restart: unless-stopped

  academic-service:
