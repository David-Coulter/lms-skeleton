server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # ---- Keycloak -------------------------------------------------
            # Keycloak runs with a /auth context path, so the prefix is kept.
            # Token requests, the login page and the password-reset flow all
            # come through here.
            - id: keycloak
              uri: http://keycloak:8080
              predicates:
                - Path=/auth/**

            # ---- user-service ---------------------------------------------
            # lb:// resolves through Eureka. Scale user-service and the
            # gateway load-balances across instances with no config change.
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**

          # CORS so the Svelte SPA can call the gateway from another origin.
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
                allowedHeaders: "*"
                allowCredentials: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-service:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: INFO
